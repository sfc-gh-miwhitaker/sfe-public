# Pair-programmed by SE Community + Cortex Code
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit (detect-secrets + policy checks)
        uses: pre-commit/action@v3.0.1
        env:
          # The dedicated job below covers history; this hook requires a local binary.
          SKIP: gitleaks

  gitleaks-full-history:
    name: Gitleaks Full History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  file-policy:
    name: Public Content Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test publication policies
        run: python3 -m unittest discover -s .github/tests -v
      - name: Check all tracked files
        run: python3 .github/scripts/check-public-content.py
