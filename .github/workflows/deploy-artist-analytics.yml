name: Deploy Artist Analytics App

on:
  push:
    branches: [main]
    paths:
      - 'demo-artist-analytics/app-runtime/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-artist-analytics/app-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.23"

      - name: Deploy to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: snow app deploy --verbose
