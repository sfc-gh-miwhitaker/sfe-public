# Pair-programmed by SE Community + Cortex Code
# Portable setup: copy this file to .pre-commit-config.yaml AND copy
# .github/scripts/check-public-content.py to the same relative path in the target
# repository. Generate a detect-secrets baseline and review it before committing.
# Install pre-commit and gitleaks, then run pre-commit install in that checkout.
# Manual check: pre-commit run --all-files
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock\.json|\.secrets\.baseline$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-symlinks

  - repo: local
    hooks:
      - id: gitleaks
        name: Detect staged secrets with gitleaks
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: public-content
        name: Check public content and private artifact boundaries
        entry: python3 .github/scripts/check-public-content.py
        language: system
        pass_filenames: false
        always_run: true
